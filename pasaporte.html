<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pasaporte de la bici · Furgobici</title>
<style>
:root{--c:#0f766e;--bg:#f4f7f6;--t:#16302d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--c);color:#fff;padding:14px 16px;font-weight:700;font-size:20px}
main{max-width:640px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h3{margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-bottom:1px solid #e3ecea;vertical-align:top}
small{color:#587}.btn{display:inline-block;background:var(--c);color:#fff;padding:12px 16px;border-radius:8px;text-decoration:none;margin-top:8px}
img{max-width:100%;max-height:200px;border-radius:8px}.err{color:#b91c1c}
</style></head><body>
<header id="h">🚲 Pasaporte de la bici</header>
<main id="m"><div class="card">Cargando…</div></main>
<script>
const CFG={https://pmeixojoagkdobkurqlu.supabase.co"",sb_publishable_q5YSORiuaU8ahRcLU9Ulrw_OKeoBKk6""};   // los mismos que en furgobici.html
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=s=>s?s.split("-").reverse().join("/"):"";
const EMO={g:"🟢",a:"🟡",r:"🔴"},TXT={g:"En buen estado",a:"Vigilar",r:"Toca revisar"};
(async()=>{const m=document.getElementById("m"),t=new URLSearchParams(location.search).get("t");
 try{
  if(!t||!/^[A-Za-z0-9]{8,32}$/.test(t))throw 0;
  const r=await fetch(CFG.supabaseUrl+"/rest/v1/rpc/get_passport",{method:"POST",headers:{apikey:CFG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify({p_token:t})});
  if(!r.ok)throw 0;const p=await r.json();if(!p)throw 0;
  document.getElementById("h").textContent="🚲 "+(p.shop&&p.shop.name||"Furgobici");
  const b=p.bike||{},site=(p.shop&&p.shop.site||"").replace(/\/+$/,"");
  m.innerHTML=`<div class="card"><h3>${esc(b.type)} ${esc(b.brand)}</h3>${b.photo&&/^data:image\/jpeg;base64,/.test(b.photo)?`<img src="${b.photo}" alt="">`:""}
   <p>${p.owner?`Propietario: ${esc(p.owner)}<br>`:""}${b.size?`Talla: ${esc(b.size)}<br>`:""}${b.serial?`Nº de serie: ${esc(b.serial)}<br>`:""}${b.comps?`Componentes: ${esc(b.comps)}`:""}</p>
   <small>Actualizado el ${fd(p.updated)}</small></div>
   ${p.next?`<div class="card"><h3>Próxima revisión recomendada</h3><b>${fd(p.next)}</b>${site?`<br><a class="btn" href="${esc(site)}/furgobici.html">Reservar revisión</a>`:""}${p.shop&&p.shop.phone?`<br><small>o llama al ${esc(p.shop.phone)}</small>`:""}</div>`:""}
   ${(p.pred||[]).length?`<div class="card"><h3>Estado estimado de componentes</h3><table>${p.pred.map(x=>`<tr><td>${EMO[x.s]||""} ${esc(x.n)}</td><td>${TXT[x.s]||""}</td><td><small>${x.due?"hacia "+fd(x.due):""}</small></td></tr>`).join("")}</table><small>Estimación según uso; no sustituye a una revisión.</small></div>`:""}
   <div class="card"><h3>Historial de mantenimiento</h3><table>${(p.history||[]).map(h=>`<tr><td>${fd(h.d)}</td><td>${esc(h.t)}<br><small>${esc((h.i||[]).join(", "))}</small></td></tr>`).join("")||"<tr><td>Aún sin intervenciones.</td></tr>"}</table></div>`;
 }catch(e){m.innerHTML='<div class="card err">Pasaporte no encontrado. Comprueba el código QR.</div>'}})();
</script></body></html>
