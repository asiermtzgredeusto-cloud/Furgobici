function lastChange(b,key){const L=S.set.life[key],re=new RegExp(L.kw,"i");let best=(b.last||{})[key]||"";
 S.jobs.filter(j=>j.bikeId==b.id&&j.status=="Terminado").forEach(j=>{if(j.tasks.concat(j.used).some(x=>re.test(x.name))&&j.date>best)best=j.date});return best||null}
function predictAll(b){const cd=S.set.cond,mult=(cd.use[b.use]??1)*(cd.wet[b.wet]??1)*(b.type=="Eléctrica"?cd.ebike:1),kw=Math.max(1,+b.kmWeek||0);
 return Object.entries(S.set.life).map(([k,L])=>{const last=lastChange(b,k);if(!last)return{k,name:L.n,state:"n",pct:0,due:null,last:null};
  const t0=new Date(last+"T00:00").getTime(),wks=Math.max(0,(Date.now()-t0)/6048e5),kmS=wks*kw,lifeKm=L.km*mult,months=(Date.now()-t0)/(30.44*864e5);
  const pk=lifeKm>0?kmS/lifeKm:0,pm=L.mo>0?months/L.mo:0,pct=Math.max(pk,pm),dw=Math.min(lifeKm>0?lifeKm/kw:Infinity,L.mo>0?L.mo*4.348:Infinity);
  return{k,name:L.n,last,pct,state:pct>=1?"r":pct>=.8?"a":"g",due:isFinite(dw)?ymd(new Date(t0+dw*6048e5)):null,kmS:Math.round(kmS)}})}

async function login(){const c=S.set.sb;if(SILENT)throw new Error("login");const pw=prompt("Contraseña de "+c.email+" (solo esta vez)");if(!pw)throw new Error("Cancelado");
 const r=await fetch(c.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify({email:c.email,password:pw})});if(!r.ok)throw new Error("Credenciales incorrectas");
 const j=await r.json();tok=j.access_token;c.rt=j.refresh_token;tokExp=Date.now()+(j.expires_in-60)*1000;persist()}
async function ensureTok(){const c=S.set.sb;if(!c.url||!c.key||!c.email)throw new Error("Conecta la web en ⚙ › Web");if(tok&&tokExp>Date.now())return;
 if(c.rt){try{const r=await fetch(c.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:c.rt})});
  if(r.ok){const j=await r.json();tok=j.access_token;c.rt=j.refresh_token;tokExp=Date.now()+(j.expires_in-60)*1000;persist();return}c.rt=""}catch(e){throw e}}
 await login()}

 if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));const t=await r.text();return t?JSON.parse(t):null}
const shrink=(d,w)=>new Promise(r=>{if(!d)return r("");const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,w/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.6))};im.onerror=()=>r("");im.src=d});

 await api("/rest/v1/pasaportes?on_conflict=token",{method:"POST",body:{token:b.passToken,bike_ref:b.id,payload,updated_at:new Date().toISOString()},prefer:"resolution=merge-duplicates,return=minimal"});persist()}

function runCalc(){const v=id=>+$("#"+id)?.value;if(!$("#cw_l"))return;const k=S.set.calc;
 const base=k.chain.pitches*k.chain.pitch,w=chainWear(v("cw_l"),base),th=k.chain[$("#cw_t").value],s=w>=th?["err","Sustituir"]:w>=th*k.chain.warn/100?["","Vigilar"]:["ok","Correcta"];
 $("#cw_r").innerHTML=`<p>Desgaste: <b>${w.toFixed(2)} %</b> (límite ${th} %) → <b class="${s[0]}">${s[1]}</b></p>`;

function qrMatrix(text){

 case"addfree":{if(!val("ft_name"))return;j.tasks.push({name:val("ft_name"),price:+val("ft_price")||0,min:0,qty:1});commit();break}
 case"ttoggle":if(j.tStart){j.elapsed=(j.elapsed||0)+Date.now()-j.tStart;j.tStart=null}else j.tStart=Date.now();commit();break;
 case"togchk":view.chk=!view.chk;render();break;
 case"togmore":view.more=!view.more;render();break;
 case"chk":{const x=j.check[t.dataset.k]||(j.check[t.dataset.k]={s:"n"});x.s=x.s==t.dataset.s?"n":t.dataset.s;commit();break}
 case"pay":finishJob(j,t.dataset.m);break;
 case"finish":finishJob(j,null);break;
 case"reopen":j.status="Abierto";j.paid=false;j.paidDate="";j.method="";if(j.citaId)queueJob(j);commit();break;
 case"deljob":if(confirm("¿Eliminar este trabajo?")){S.jobs=S.jobs.filter(x=>x.id!=id);view={tab:"jobs"};commit()}break;
 case"doc":docState={t:t.dataset.t,id};showDoc();break;
 case"closedoc":$("#doc").classList.add("hide");break;
 case"printdoc":window.print();break;
 case"copydoc":copy(docState.text);break;
 case"wadoc":window.open("https://wa.me/"+(docState.phone?"34"+normPhone(docState.phone):"")+"?text="+encodeURIComponent(docState.text),"_blank","noopener");break;
 case"clientsback":view={tab:"clients"};render();break;
 case"togclient":view.addc=!view.addc;render();break;
 case"newclient":if(!val("nc_name")){toast("Escribe el nombre");return}S.clients.push({id:uid(),name:val("nc_name"),phone:val("nc_phone"),email:val("nc_email"),notes:""});view.addc=false;commit();break;
 case"openclient":view={tab:"clients",id};render();break;
 case"openbike":view={tab:"clients",id:view.id,bike:id};render();break;
 case"bikeback":view={tab:"clients",id:B(view.bike).clientId};render();break;
 case"delclient":if(confirm("¿Eliminar cliente, sus bicis y sus trabajos?")){const bs=S.bikes.filter(b=>b.clientId==id).map(b=>b.id);S.jobs=S.jobs.filter(x=>!bs.includes(x.bikeId));S.bikes=S.bikes.filter(b=>b.clientId!=id);S.clients=S.clients.filter(c=>c.id!=id);view={tab:"clients"};commit()}break;
 case"delbike":if(confirm("¿Eliminar bici y sus trabajos?")){const c=B(id).clientId;S.jobs=S.jobs.filter(x=>x.bikeId!=id);S.bikes=S.bikes.filter(b=>b.id!=id);view={tab:"clients",id:c};commit()}break;
 case"togaddp":view.addp=!view.addp;render();break;
 case"slow":view.low=t.dataset.v=="1";render();break;
 case"addprt":if(!val("np_name")){toast("Escribe el nombre de la pieza");return}S.parts.push({id:uid(),name:val("np_name"),price:+val("np_price")||0,cost:0,stock:+val("np_stock")||0,min:1,uses:0});view.addp=false;commit();break;
 case"quickpart":{const p={id:uid(),name:t.dataset.n,price:0,cost:0,stock:1,min:1,uses:0};S.parts.push(p);view.sq="";view.pexp=p.id;commit();buzz();toast("Creada «"+p.name+"» con 1 en stock · pon el precio abajo");break}
 case"use":{const p=P(id);if(p.stock<=0){toast("Ya no quedan «"+p.name+"»");return}p.stock--;p.uses=(p.uses||0)+1;persist();render();buzz();toast(`−1 ${p.name} · quedan ${p.stock}`,()=>{p.stock++;p.uses--;persist();render()});break}
 case"stk":{const p=P(id);p.stock=Math.max(0,p.stock+ +t.dataset.d);persist();render();buzz();toast(`+1 ${p.name} · hay ${p.stock}`,()=>{p.stock--;persist();render()});break}
 case"pexp":view.pexp=view.pexp==id?null:id;render();break;
 case"delprt":if(confirm("¿Borrar esta pieza?")){S.parts=S.parts.filter(p=>p.id!=id);view.pexp=null;commit()}break;
 case"recvview":view={tab:"stock",recv:true};render();break;
 case"recvback":view={tab:"stock"};render();break;
 case"rq":{const r=view.rl[id];r.q=Math.max(1,r.q+ +t.dataset.d);render();break}
 case"recvok":{let tot=0,n=0;Object.entries(view.rl).forEach(([pid,r])=>{const p=P(pid);if(!p)return;p.stock+=r.q;if(r.c>0)p.cost=r.c;tot+=r.q*r.c;n+=r.q});
  const sup=val("rv_s");if(tot>0)S.expenses.push({id:uid(),date:ymd(new Date()),concept:sup?"Pedido "+sup:"Pedido de piezas",amount:r2(tot),cat:"Piezas"});
  view={tab:"stock"};commit();buzz();toast(`+${n} piezas${tot>0?" · gasto "+money(tot):""}`);break}
 case"copybuy":copy("Lista de compra "+S.set.name+":\n"+S.parts.filter(p=>p.stock<=p.min).map(p=>`- ${p.name}: ${Math.max(1,p.min*2-p.stock)} uds`).join("\n"));break;
 case"mm":view.m=mshift(view.m||ymd(new Date()).slice(0,7),+t.dataset.d);render();break;
 case"catsel":view.cat=t.dataset.k;render();break;
 case"exptpl":{const a=+t.dataset.a;if(a>0)addExpense(t.dataset.c,a,t.dataset.k);else{view={tab:"money",m:view.m,cat:t.dataset.k,exc:t.dataset.c,exa:""};render();const e=$("#ex_a");e&&e.focus&&e.focus()}break}
 case"fxtpl":view.fxc=t.dataset.c;view.fxk=t.dataset.k;render();break;
 case"addexp":{const a=+val("ex_a");if(!(a>0)){toast("Indica el importe");return}const cat=view.cat||"Piezas",ph=view.expPhoto;view.exc="";view.exa="";view.expPhoto="";addExpense(val("ex_c")||cat,a,cat,ph);break}
 case"delexp":S.expenses=S.expenses.filter(e=>e.id!=id);commit();break;
 case"addfx":{const a=+val("fx_a");if(!val("fx_c")||!(a>0)){toast("Concepto e importe");return}S.fixed.push({id:uid(),concept:val("fx_c"),amount:a,cat:view.fxk||"Otros",from:view.m||ymd(new Date()).slice(0,7)});view.fxc="";view.fxk="";commit();break}
 case"delfx":S.fixed=S.fixed.filter(f=>f.id!=id);commit();break;
 case"copymonth":copy(buildMonth(id).text);break;
 case"csvmonth":{const s=mstats(id);download("resumen-"+id+".csv",csv([["Tipo","Fecha","Concepto","Categoría / método","Importe"]].concat(s.inc.map(x=>["Ingreso",x.paidDate,x.receiptNo,x.method,r2(jobTotals(x).total)]),s.ex.map(e=>["Gasto",e.date,e.concept,e.cat,e.amount]),s.fx.map(f=>["Gasto fijo",id,f.concept,f.cat,f.amount]))));break}
 case"addlab2":if(!val("nl_name"))return;S.labor.push({id:uid(),name:val("nl_name"),price:+val("nl_price")||0,min:+val("nl_min")||0});commit();break;
 case"dellab":S.labor=S.labor.filter(p=>p.id!=id);commit();break;
 case"csvjobs":download("trabajos.csv",csv([["Fecha","Cliente","Bici","Título","Estado","Total","IVA","Pagado","Método","Fecha pago","Recibo","Horas"]].concat(S.jobs.map(x=>{const b=B(x.bikeId),T=jobTotals(x);return[x.date,(C(b&&b.clientId)||{}).name,bikeLabel(b),x.title,x.status,r2(T.total),r2(T.iva),x.paid?"sí":"no",x.method,x.paidDate,x.receiptNo,(elapsedMs(x)/36e5).toFixed(2)]}))));break;
 case"csvexp":download("gastos.csv",csv([["Fecha","Concepto","Categoría","Importe"]].concat(S.expenses.map(e=>[e.date,e.concept,e.cat,e.amount]),S.fixed.map(f=>["(mensual desde "+f.from+")",f.concept,f.cat,f.amount]))));break;
 case"csvinv":download("inventario.csv",csv([["Pieza","PVP","Coste","Stock","Mínimo"]].concat(S.parts.map(p=>[p.name,p.price,p.cost,p.stock,p.min]))));break;
 case"backup":S.lastBackup=Date.now();persist();download("furgobici-taller-"+ymd(new Date())+".json",JSON.stringify(S),"application/json");render();break;
 case"calcreset":S.set.calc[t.dataset.p]=CALC0()[t.dataset.p];commit();break;
 case"addtq":{const mn=+val("tq_a"),mx=+val("tq_z")||mn;if(!val("tq_c")||!mn)return;S.torque.push({id:uid(),comp:val("tq_c"),brand:val("tq_b"),min:mn,max:mx});commit();break}
 case"deltq":S.torque=S.torque.filter(x=>x.id!=id);commit();break;
 case"websync":(async()=>{toast("Sincronizando…");await autoSync(true);render()})();break;
 case"cita2job":{const c=S.webCitas.find(x=>String(x.id)==id);if(c){view={tab:"jobs",id:jobFromCita(c).id};commit()}break}
 case"pubpass":(async()=>{setMsg("pubmsg","Publicando…");try{await publishPass(id);S.outbox=S.outbox.filter(o=>!(o.k=="pass"&&o.bikeId==id));persist();docState={t:"qr",id};showDoc()}catch(e){setMsg("pubmsg","No se pudo publicar: "+e.message,"err")}})();break;
 case"pubzones":(async()=>{setMsg("zmsg","Publicando…");try{await api("/rest/v1/zonas?dow=gte.0",{method:"DELETE",prefer:"return=minimal"});
   if(S.zones.length)await api("/rest/v1/zonas",{method:"POST",body:S.zones.map(z=>{const[d,...q]=z.split("|");return{dow:+d,town:q.join("|")}}),prefer:"return=minimal"});setMsg("zmsg","Zonas publicadas ✔","ok")}catch(e){setMsg("zmsg","Error: "+e.message,"err")}})();break;
 }}
function chg(k,el){const d=el.dataset,id=d.id,j=J(id);
 switch(k){
 case"jq":case"cq":view.q=el.value;render();break;
 case"nq":view.nq=el.value;render();break;
 case"sq":view.sq=el.value;render();break;
 case"mb":view.mb=el.value;render();break;
 case"jf":{let v=el.value;if(d.f=="disc")v=+v||0;j[d.f]=v;commit();break}
 case"addany":{const[w,pid]=el.value.split(":");if(w=="l"){const l=S.labor.find(x=>x.id==pid),ex=j.tasks.find(x=>x.name==l.name);ex?ex.qty++:j.tasks.push({name:l.name,price:l.price,min:l.min,qty:1})}else if(w=="p")addUse(j,P(pid));commit();break}
 case"chknote":(j.check[d.k]||(j.check[d.k]={s:"n"})).note=el.value;persist();break;
 case"chkphoto":compress(el.files[0]).then(p=>{if(p){(j.check[d.k]||(j.check[d.k]={s:"n"})).photo=p;commit()}});break;
 case"cf":C(id)[d.f]=el.value;persist();break;
 case"bf":B(id)[d.f]=el.type=="checkbox"?el.checked:d.n?+el.value||0:el.value;commit();break;
 case"bphoto":compress(el.files[0]).then(p=>{if(p){B(id).photo=p;commit()}});break;
 case"blast":{const b=B(id);b.last=b.last||{};if(el.value)b.last[d.k]=el.value;else delete b.last[d.k];commit();break}
 case"stk":{const p=P(id);p.stock=Math.max(0,Math.round(+el.value)||0);commit();break}
 case"pf":{const p=P(id);p[d.f]=+el.value||0;commit();break}
 case"rc":view.rl[id].c=+el.value||0;render();break;
 case"raddp":if(el.value){view.rl[el.value]={q:1,c:P(el.value).cost||0};render()}break;
 case"exphoto":compress(el.files[0]).then(p=>{view.expPhoto=p;render()});break;
 case"autojobs":S.set.autoJobs=el.checked;persist();break;
 case"lf":{const p=S.labor.find(x=>x.id==id);p[d.f]=d.f=="name"?el.value:+el.value||0;commit();break}
 case"life":S.set.life[d.k][d.f]=d.f=="kw"?el.value:+el.value||0;commit();break;
 case"cond":if(d.g=="ebike")S.set.cond.ebike=+el.value||1;else S.set.cond[d.g][d.k]=+el.value||1;persist();break;
 case"sf":S.set[d.f]=["iva","target"].includes(d.f)?+el.value||0:el.value;commit();break;
 case"sbf":S.set.sb[d.f]=el.value.trim();if(d.f!="site"){tok="";S.set.sb.rt=""}persist();break;
 case"zone":{const s=new Set(S.zones);el.checked?s.add(d.k):s.delete(d.k);S.zones=[...s];persist();break}
 case"cc":{const[g,f]=d.p.split(".");S.set.calc[g][f]=el.type=="checkbox"?el.checked:(el.type=="number"||d.t=="n")?+el.value:el.value;persist();runCalc();break}
 case"restore":{const f=el.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.jobs||!o.clients)throw 0;if(confirm("Se reemplazarán los datos actuales. ¿Continuar?")){S=migrate(o);commit()}}catch(e){alert("Archivo no válido")}});break}
 }}
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t){if(t.tagName=="A")e.preventDefault();act(t.dataset.act,t)}});
document.addEventListener("change",e=>{const t=e.target.closest("[data-chg]");if(t)chg(t.dataset.chg,t)});
setInterval(()=>{const j=view.id&&view.tab=="jobs"&&J(view.id);if(j&&j.tStart&&$("#tmr"))$("#tmr").textContent=hms(elapsedMs(j))},1000);
const bg=()=>{if(S&&S.set.sb.url&&view.tab!="adv")autoSync(false)};
window.addEventListener("online",bg);document.addEventListener("visibilitychange",()=>{if(!document.hidden)bg()});setInterval(bg,5*60*1000);

(async()=>{S=migrate((await load())||seed());navigator.storage?.persist?.();persist();render();bg();
 if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("taller-sw.js").catch(()=>{})})();
</script></body></html>
